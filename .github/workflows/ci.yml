name: CI

on:
  push:
    branches: [main]
  pull_request:
  # e2e on demand (Actions → CI → Run workflow) …
  workflow_dispatch:
  # … and once a day, for what the path filter below lets through (03:00 KST)
  schedule:
    - cron: "0 18 * * *"

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # the contract tests compare the client with the server repo (chord validator fixtures,
      # the world contract); without it they'd quietly skip
      KORDI_SERVER_DIR: ${{ github.workspace }}/kordi-server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: kordi-app/kordi-server
          path: kordi-server
          sparse-checkout: |
            src/main/resources/world-contract.json
            src/test/resources/chord-validator-fixtures.json
          sparse-checkout-cone-mode: false

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # Does this push / PR touch what the playtests exercise? (A plain git diff: no third-party action.)
  # Manual and nightly runs always play; so does anything we can't diff (a new branch).
  changes:
    runs-on: ubuntu-latest
    outputs:
      world: ${{ steps.diff.outputs.world }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          case "$EVENT" in
            push) from="$BEFORE" ;;
            pull_request) from="$BASE" ;;
            *) echo "world=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          if [ -z "$from" ] || ! git cat-file -e "$from^{commit}" 2>/dev/null; then
            echo "world=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$from" HEAD -- \
              src/widgets/piano-world src/entities/character src/views/home \
              e2e playwright.config.ts next.config.ts package.json pnpm-lock.yaml \
              .github/workflows/ci.yml | grep -q .; then
            echo "world=true" >> "$GITHUB_OUTPUT"
          else
            echo "world=false" >> "$GITHUB_OUTPUT"
          fi

  # Playtests of the 3D world in a real (CPU-rendered) browser, against a build of the app.
  # They never gate a deploy (Vercel deploys main on its own): a red run is a message to fix it.
  e2e:
    needs: changes
    if: needs.changes.outputs.world == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # the browser is ~100 MB: keep it between runs, per Playwright version
      - id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - id: browser-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browser-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      # a cached browser still needs the system libraries it links against
      - if: steps.browser-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # Next's build cache: an unchanged module isn't compiled again
      - uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'next.config.ts') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - run: pnpm e2e

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
